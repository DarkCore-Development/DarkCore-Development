<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DarkCore Admin Login</title>

<style>

*{margin:0;padding:0;box-sizing:border-box}

:root{
    --bg:#060606;
    --panel:#0f0f10;
    --red:#e50914;
    --text:#ffffff;
    --muted:#b8b8b8;
    --line:rgba(255,255,255,.09);
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 20% 15%, rgba(229,9,20,.18), transparent 32%),
        radial-gradient(circle at 80% 5%, rgba(229,9,20,.10), transparent 30%),
        linear-gradient(180deg,#050505,#0a0a0b);
    color:var(--text);
    font-family:'Segoe UI',Arial,sans-serif;
    padding:20px;
    overflow:hidden;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:.35;
}

.login-container{
    width:100%;
    max-width:520px;
    background:
        linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.018)),
        var(--panel);
    border:1px solid var(--line);
    border-radius:28px;
    padding:46px 38px;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    backdrop-filter:blur(12px);
    animation:loginEnter .55s ease both;
}

@keyframes loginEnter{
    from{opacity:0;transform:translateY(24px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

.login-logo{
    width:330px;
    max-width:100%;
    margin:0 auto 26px;
    display:block;
    filter:drop-shadow(0 0 22px rgba(229,9,20,.40));
    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

.logo-text{
    color:#fff;
    font-size:34px;
    font-weight:900;
    margin-bottom:8px;
    letter-spacing:-.5px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:28px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:1px solid var(--line);
    border-radius:14px;
    background:rgba(255,255,255,.045);
    color:#fff;
    outline:none;
    transition:.25s;
}

input:focus{
    border-color:rgba(229,9,20,.55);
    box-shadow:0 0 0 4px rgba(229,9,20,.10);
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:var(--red);
    color:#fff;
    font-weight:900;
    cursor:pointer;
    transition:.25s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 18px 32px rgba(229,9,20,.24);
}

.error{
    color:#ff5a5a;
    margin-top:16px;
    display:none;
}

@media(max-width:520px){
    .login-container{padding:34px 22px}
    .login-logo{width:280px}
    .logo-text{font-size:30px}
}



/* Login corporativo clean */
body{
    background:
        radial-gradient(circle at 12% 10%, rgba(201,24,35,.10), transparent 32%),
        linear-gradient(180deg,#08090b,#0d0f14) !important;
}

.login-container{
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02)), #111317 !important;
    border:1px solid rgba(255,255,255,.10) !important;
    box-shadow:0 30px 80px rgba(0,0,0,.38) !important;
}

.login-logo{
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.38)) !important;
    animation:none !important;
}

button{
    background:linear-gradient(135deg,#c91823,#9f111b) !important;
}

button:hover{
    box-shadow:0 18px 38px rgba(0,0,0,.28) !important;
}

input{
    background:rgba(255,255,255,.04) !important;
    border:1px solid rgba(255,255,255,.10) !important;
}

input:focus{
    border-color:rgba(201,24,35,.45) !important;
    box-shadow:0 0 0 4px rgba(201,24,35,.08) !important;
}



/* Animações login estilo SaaS */
.login-container{
    animation:loginSaas .62s cubic-bezier(.2,.8,.2,1) both !important;
}

@keyframes loginSaas{
    from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(5px)}
    to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}

input,
button{
    animation:loginField .48s ease both;
}

input:nth-of-type(1){animation-delay:.12s}
input:nth-of-type(2){animation-delay:.18s}
button{animation-delay:.24s}

@keyframes loginField{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
}



/* Login responsivo final */
@media(max-width:640px){
    body{
        padding:14px !important;
    }

    .login-container{
        padding:34px 22px !important;
        border-radius:22px !important;
    }

    .login-logo{
        width:260px !important;
    }

    .logo-text{
        font-size:28px !important;
    }

    .subtitle{
        font-size:14px !important;
    }
}

@media(max-width:390px){
    .login-logo{
        width:230px !important;
    }

    .login-container{
        padding:30px 18px !important;
    }
}

</style>
</head>

<body>

<div class="login-container">
    <img src="logo.png" alt="DarkCore" class="login-logo">

    <div class="logo-text">DARKCORE</div>
    <div class="subtitle">Painel Administrativo</div>

    <input type="text" id="username" placeholder="Usuário">
    <input type="password" id="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>

    <div class="error" id="error">Usuário ou senha incorretos.</div>
</div>

<script>
const ADMIN_USER = "admin";
const ADMIN_PASS = "Ducatti1#";

function login(){
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if(user === ADMIN_USER && pass === ADMIN_PASS){
        localStorage.setItem("darkcore_logged","true");
        window.location.href = "admin.html";
    }else{
        document.getElementById("error").style.display = "block";
    }
}

document.addEventListener("keydown", function(e){
    if(e.key === "Enter") login();
});
</script>

</body>
</html>
